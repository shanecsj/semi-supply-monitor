# Directed dependency edges: `from` feeds `to`, with a propagation lag range in weeks.
edges:
  - {from: silicon_wafer,   to: logic_wafer,   lag_weeks: [4, 10]}
  - {from: silicon_wafer,   to: dram_die,      lag_weeks: [4, 10]}
  - {from: silicon_wafer,   to: nand_die,      lag_weeks: [4, 10]}
  - {from: photoresist,     to: logic_wafer,   lag_weeks: [3, 8]}
  - {from: photoresist,     to: dram_die,      lag_weeks: [3, 8]}
  - {from: litho_equipment, to: logic_wafer,   lag_weeks: [26, 78]}
  - {from: litho_equipment, to: dram_die,      lag_weeks: [26, 78]}
  - {from: logic_wafer,     to: cowos,         lag_weeks: [2, 6]}
  - {from: dram_die,        to: hbm_stack,     lag_weeks: [1, 3]}
  - {from: dram_die,        to: dram_module,   lag_weeks: [1, 3]}
  - {from: nand_die,        to: ssd,           lag_weeks: [1, 3]}
  - {from: nand_die,        to: osat,          lag_weeks: [1, 3]}
  - {from: hbm_stack,       to: cowos,         lag_weeks: [1, 2]}
  - {from: abf_substrate,   to: cowos,         lag_weeks: [3, 8]}
  - {from: abf_substrate,   to: osat,          lag_weeks: [3, 8]}
  - {from: cowos,           to: gpu_module,    lag_weeks: [1, 3]}
  - {from: osat,            to: dram_module,   lag_weeks: [1, 2]}
  - {from: gpu_module,      to: server_board,  lag_weeks: [2, 4]}
  - {from: dram_module,     to: server_board,  lag_weeks: [1, 2]}
  - {from: ssd,             to: server_board,  lag_weeks: [1, 2]}
  - {from: gpu_module,      to: retail_supply, lag_weeks: [3, 6]}
  - {from: dram_module,     to: retail_supply, lag_weeks: [2, 5]}
  - {from: ssd,             to: retail_supply, lag_weeks: [2, 5]}
  - {from: server_board,    to: retail_supply, lag_weeks: [2, 4]}
