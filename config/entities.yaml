# Layer 0 - Entity & chokepoint registry for RAM (DRAM/NAND) and GPU supply chains.
#
# Node types:
#   company    - corporate entity; carries tickers + filing IDs
#   site       - physical fab / packaging plant; carries lat/lon for geospatial sensor joins
#   stage      - a step in the chain (a product or process); the graph's structural backbone
#   route      - a shipping corridor or port; tracked via news, not telemetry
#
# concentration: 0..1 supplier-concentration proxy (1.0 = effectively single-sourced).
#                Drives how alarming a disruption at this node is.
# Coordinates are approximate to ~1km, well inside the radius joins that consume them.

nodes:

  # ---------------------------------------------------------------- stages
  - {id: silicon_wafer,   type: stage, name: "Silicon wafer",              concentration: 0.70}
  - {id: photoresist,     type: stage, name: "Photoresist & specialty chemicals", concentration: 0.80}
  - {id: litho_equipment, type: stage, name: "Lithography equipment",      concentration: 0.95}
  - {id: abf_substrate,   type: stage, name: "ABF substrate",              concentration: 0.70}
  - {id: logic_wafer,     type: stage, name: "Leading-edge logic wafer (N3/N4/N2)", concentration: 0.90}
  - {id: dram_die,        type: stage, name: "DRAM die",                   concentration: 0.55}
  - {id: nand_die,        type: stage, name: "NAND die",                   concentration: 0.40}
  - {id: hbm_stack,       type: stage, name: "HBM stack",                  concentration: 0.75}
  - {id: cowos,           type: stage, name: "CoWoS / SoIC advanced packaging", concentration: 0.95}
  - {id: osat,            type: stage, name: "Commodity OSAT packaging",   concentration: 0.35}
  - {id: gpu_module,      type: stage, name: "GPU / accelerator module",   concentration: 0.85}
  - {id: dram_module,     type: stage, name: "DDR5 module",                concentration: 0.30}
  - {id: ssd,             type: stage, name: "SSD / storage",              concentration: 0.30}
  - {id: server_board,    type: stage, name: "Server board & system assembly", concentration: 0.40}
  - {id: retail_supply,   type: stage, name: "Retail / channel supply",    concentration: 0.10}

